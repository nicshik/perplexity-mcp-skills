name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Python files
        run: python3 -m py_compile perplexity_common.py perplexity_search_only/scripts/search_only.py perplexity-pro-search/scripts/pro_search.py perplexity-fetch-url-content/scripts/fetch_url_content.py

      - name: Run offline smoke checks
        run: ./scripts/check.sh

      - name: Typecheck npm CLI
        run: npm run typecheck

      - name: Test npm CLI
        run: npm test

      - name: Verify npm package contents
        run: npm run pack:dry-run
