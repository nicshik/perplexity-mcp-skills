schema_version: "0.1"
bundle_name: "perplexity-mcp-skills"
maintainer: "nick"
source_of_truth: "https://github.com/nicshik/perplexity-mcp-skills"
supported_runtimes:
  - "codex"
  - "windsurf"
  - "cursor"
  - "claude_code"
  - "antigravity"
project_configs:
  cursor_mcp: ".cursor/mcp.json"
  cursor_rule: ".cursor/rules/perplexity.mdc"
  claude_mcp: ".mcp.json"
  claude_skills: ".claude/skills"
  shared_agent_rules: "AGENTS.md"
skills:
  - name: "perplexity_search_only"
    path: "perplexity_search_only"
    purpose: "Search only mode through Perplexity MCP with direct Search API fallback"
    install_target: "~/.codex/skills/perplexity_search_only"
    windsurf_skill: ".windsurf/skills/perplexity-search"
    windsurf_workflow: ".windsurf/workflows/perplexity-search.md"
    windsurf_rule: ".windsurf/rules/perplexity-mcp-skills.md"
    claude_skill: ".claude/skills/perplexity-search-only/SKILL.md"
  - name: "perplexity_deep_research"
    path: "perplexity_deep_research"
    purpose: "Deep Research mode through Perplexity MCP"
    install_target: "~/.codex/skills/perplexity_deep_research"
    windsurf_skill: ".windsurf/skills/perplexity-research"
    windsurf_workflow: ".windsurf/workflows/perplexity-research.md"
    windsurf_rule: ".windsurf/rules/perplexity-mcp-skills.md"
    claude_skill: ".claude/skills/perplexity-deep-research/SKILL.md"
  - name: "perplexity-pro-search"
    path: "perplexity-pro-search"
    purpose: "Pro Search mode through Sonar Pro"
    install_target: "~/.codex/skills/perplexity-pro-search"
    windsurf_skill: ".windsurf/skills/perplexity-pro"
    windsurf_workflow: ".windsurf/workflows/perplexity-pro.md"
    windsurf_rule: ".windsurf/rules/perplexity-mcp-skills.md"
    claude_skill: ".claude/skills/perplexity-pro-search/SKILL.md"
  - name: "perplexity-fetch-url-content"
    path: "perplexity-fetch-url-content"
    purpose: "Fetch URL mode through Sonar Pro fetch_url_content"
    install_target: "~/.codex/skills/perplexity-fetch-url-content"
    windsurf_skill: ".windsurf/skills/perplexity-fetch-url"
    windsurf_workflow: ".windsurf/workflows/perplexity-fetch-url.md"
    windsurf_rule: ".windsurf/rules/perplexity-mcp-skills.md"
    claude_skill: ".claude/skills/perplexity-fetch-url/SKILL.md"
